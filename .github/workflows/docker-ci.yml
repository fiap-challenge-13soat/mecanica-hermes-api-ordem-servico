name: Build and Publish Docker Image

# Triggers:
#   1. workflow_run: builds the image only after "Build and Tests CI" passes on main.
#      Uses the exact commit SHA that passed CI to avoid building a stale HEAD.
#   2. push tags v*.*.*: version releases are tagged from tested main commits, so
#      no test gate is required here — the tag itself is the promotion gate.
#
# Feature branches are intentionally excluded: they go through build-and-tests-ci
# only; no Docker image is published until the commit merges to main.
#
# The "release: published" trigger was removed: publishing a GitHub Release
# creates a vX.Y.Z tag, which already fires the "push tags" trigger above.
# Having both would build and push the same image twice.
on:
  workflow_run:
    workflows: ["Build and Tests CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: mechermes/mecanica-hermes-api-ordem-servico

jobs:
  docker:
    # Skip when the upstream CI run failed or was cancelled.
    # Tag pushes always proceed (the commit was already validated on main).
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.6.0
        with:
          # workflow_run: build the exact commit that passed CI, not the current HEAD
          # (a newer commit may have landed between the CI run and this workflow starting)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # docker/metadata-action reads GITHUB_SHA to generate the sha- tag.
      # For workflow_run events GITHUB_SHA points to the HEAD of the default branch
      # at the time this workflow runs, which may differ from the tested commit.
      # Override it so the sha tag is always traceable to the exact tested commit.
      - name: Alinhar GITHUB_SHA com o commit testado
        if: github.event_name == 'workflow_run'
        run: echo "GITHUB_SHA=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Verificar existência do Dockerfile
        run: test -f Dockerfile

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Short SHA for traceability on every published image
            type=sha,format=short,prefix=sha-

            # SemVer tags when a vX.Y.Z tag is pushed
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

            # 'latest' only for commits that arrived via the CI gate on main
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
