name: Build and Tests CI

on:
  push:
    branches:
      - "main"
      - "feature/**"

jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.6.0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar pacotes
        run: dotnet restore Mecanica.Hermes.Ordem.Servico.sln

      - name: Build
        run: dotnet build Mecanica.Hermes.Ordem.Servico.sln --configuration Release --no-restore

      - name: Verificar Docker
        run: |
          docker --version
          docker ps

      - name: Instalar dependências auxiliares
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Executar testes com cobertura
        run: |
          dotnet test Mecanica.Hermes.Ordem.Servico.sln \
            -c Release \
            --no-restore \
            --settings coverlet.runsettings \
            --results-directory .temp/coverage \
            --logger:"console;verbosity=normal"
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Listar arquivos de cobertura gerados
        run: find .temp/coverage -name "*.opencover.xml" -o -name "*.cobertura.xml"

      - name: Gerar relatório HTML + Sumário
        run: |
          reportgenerator \
            -reports:".temp/coverage/**/coverage.opencover.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;JsonSummary;TextSummary" \
            -filefilters:"-*.g.cs;-*Designer.cs;-*Migrations/*.cs" \
            -title:"Cobertura de Testes"

      - name: Publicar artefato de cobertura HTML
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.6.0
        with:
          name: cobertura-html
          path: coverage-report
          if-no-files-found: error
          retention-days: 7

      - name: Verificar threshold de cobertura (>=80% line)
        shell: bash
        run: |
          if [ ! -f coverage-report/Summary.json ]; then
            echo "Summary.json não encontrado. Falhando." >&2
            exit 1
          fi
          LINE=$(jq -r '.summary.linecoverage // 0' coverage-report/Summary.json)
          BRANCH=$(jq -r '.summary.branchcoverage // 0' coverage-report/Summary.json)
          echo "Line Coverage: ${LINE}%"
          echo "Branch Coverage: ${BRANCH}%"
          THRESHOLD=80
          awk -v cov="$LINE" -v thr="$THRESHOLD" 'BEGIN { exit (cov+0 < thr) ? 1 : 0 }' || {
            echo "Cobertura ${LINE}% abaixo do threshold mínimo (${THRESHOLD}%)." >&2
            exit 1
          }
          echo "Cobertura mínima de linhas atendida (>= ${THRESHOLD}%)."
